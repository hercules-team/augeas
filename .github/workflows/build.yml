name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs of the same branch or PR are of no interest
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.cc }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # valgrind is slow; running it once is enough to catch leaks
          - cc: gcc
            valgrind: true
          - cc: clang
            valgrind: false

    env:
      CC: ${{ matrix.cc }}

    steps:
      - uses: actions/checkout@v5

      # The package mirrors are often slow (~100 kB/s). Nearly all of the
      # download is valgrind: it hard-depends on libc6-dbg, which must match
      # libc exactly and so also pulls in a libc upgrade (~35 MB in all).
      # Install it only where it is used, and cache the .debs keyed on the
      # exact set of files apt wants (file names, not URLs, since the mirror
      # host differs between runners).
      - name: Plan deps
        id: deps
        run: |
          pkgs="autoconf automake bison flex libtool-bin
                libreadline-dev libselinux1-dev libxml2-dev pkg-config"
          if ${{ matrix.valgrind }}; then pkgs="$pkgs valgrind"; fi
          sudo apt-get update
          apt-get install -qq -y --no-install-recommends --print-uris $pkgs \
            | awk '{print $2}' | sort > "$RUNNER_TEMP/debs.txt"
          echo "pkgs=$(echo $pkgs)" >> "$GITHUB_OUTPUT"
          echo "key=$(sha256sum "$RUNNER_TEMP/debs.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ~/debs
          key: apt-debs-${{ matrix.cc }}-${{ steps.deps.outputs.key }}
          restore-keys: apt-debs-${{ matrix.cc }}-

      - name: Install deps
        run: |
          mkdir -p ~/debs/partial
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/debs" ${{ steps.deps.outputs.pkgs }}
          # Keep only what this install needed, so the cache does not grow
          cd ~/debs
          sudo rm -rf partial lock
          for f in *.deb; do
            grep -qxF "$f" "$RUNNER_TEMP/debs.txt" || rm -f "$f"
          done

      # Populate the gnulib submodule from the cache, or with a shallow fetch,
      # so that bootstrap does not clone all of gnulib's history
      - uses: ./.github/actions/gnulib

      # autogen.sh runs bootstrap and then configure
      - name: Autogen
        run: ./autogen.sh

      - name: Make
        run: make -j$(nproc)

      # The automake harness runs tests in parallel when given -j; each test
      # uses its own scratch directory under build/
      - name: Make check
        run: make -j$(nproc) check VERBOSE=1

      # 'make check' only prints the path of the log on failure, and the log
      # is not part of the run's artifacts
      - name: Show test failures
        if: failure()
        run: cat tests/test-suite.log || true

      - name: Valgrind
        if: matrix.valgrind
        run: ./src/try valgrind
